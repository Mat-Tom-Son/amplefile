[package]
name = "amplefile-linux-hosts"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[[bin]]
name = "amplefile-cli"
path = "src/cli.rs"
